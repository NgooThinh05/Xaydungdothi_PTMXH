services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mxh-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # Bolt (Python driver)
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mxh-password}
      # APOC (tiện ích nạp dữ liệu) + GDS (PageRank, Louvain, ... cho bài cuối kỳ)
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_apoc_import_file_enabled: "true"
      # Máy còn ~3GB RAM trống -> giữ bộ nhớ thấp; tăng nếu chạy GDS trên đồ thị lớn
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1500m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      # Ổ KINGSTON là exFAT (không hỗ trợ chown) -> dữ liệu DB để trong named volume
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      # Thư mục import chỉ đọc: file CSV/JSON đã xử lý để nạp vào đồ thị
      - ./data/processed:/import:ro

volumes:
  neo4j_data:
  neo4j_plugins:
